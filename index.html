<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1930"><title>化學遇見植物染｜藍染與紅花染的探索</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--surface:#152039;--stroke:#33455e;--txt:#f3f6fa;--muted:#b6c4d6;--accent:#82bcf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}button{cursor:pointer;border:1px solid var(--stroke);border-radius:11px;background:#243653;color:var(--txt);font-size:14px;padding:10px 15px}button:hover,button:focus-visible{background:#355279;outline:2px solid var(--accent)}button:disabled{opacity:.35;cursor:default}.top{max-width:1500px;margin:auto;padding:16px 20px 8px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font-size:clamp(16px,2vw,23px);font-weight:700;margin:0}.top small{color:var(--muted);font-size:12px}.outer{max-width:1500px;margin:0 auto;padding:10px 20px 35px}.slide{width:100%;aspect-ratio:16/9;margin:auto;border-radius:6px;overflow:hidden;box-shadow:0 12px 45px #0009;background:#101829;display:flex;align-items:center;justify-content:center}.slide img{width:100%;height:100%;object-fit:contain;display:block}.bar{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin:18px 0}.counter{font-variant-numeric:tabular-nums;color:var(--muted);min-width:86px;text-align:center}.notes{border:1px solid var(--stroke);background:var(--surface);border-radius:14px;margin:17px auto 0;max-width:1100px;padding:22px 25px;line-height:1.95;font-size:17px;white-space:pre-wrap}.notes h2{font-size:17px;margin:0 0 12px;color:var(--accent)}.notes p{margin:0}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px 0}.thumb{display:block;padding:5px;background:#18253c;border:2px solid transparent;text-align:left}.thumb.selected{border-color:var(--accent)}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.thumb span{display:block;font-size:12px;margin:6px;color:#cfdaee}.help{color:var(--muted);font-size:12px;text-align:center}.full .top,.full .bar,.full .notes,.full .help{display:none!important}.full .outer{padding:0;max-width:none}.full .slide{border-radius:0;height:100vh;width:100vw;aspect-ratio:auto;box-shadow:none}.full .slide img{object-fit:contain}body.full{overflow:hidden}@media(max-width:600px){.top{padding:12px}.outer{padding:6px 7px 25px}.bar button{padding:9px;font-size:13px}.notes{padding:15px;font-size:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body><header class="top"><div><h1>化學遇見植物染｜藍染與紅花染的探索</h1><small>國立臺灣師範大學化學系名譽教授 林震煌｜55 頁教學投影片</small></div></header>
<main class="outer"><section id="viewer"><div class="slide" id="slideArea"><img id="slideImage" src="slides/slide-01.jpg" alt="第 1 頁投影片"></div><nav class="bar" aria-label="投影片控制"><button id="prev" type="button">← 上一頁</button><span class="counter" id="counter">1 / 55</span><button id="next" type="button">下一頁 →</button><button id="notesButton" type="button" aria-expanded="false">顯示講稿</button><button id="overviewButton" type="button" aria-expanded="false">頁面總覽</button><button id="fullButton" type="button">全螢幕</button></nav><section class="notes hidden" id="notesPane" aria-label="教師講稿"><h2 id="noteHeading">第 1 頁｜教師講稿</h2><p id="noteText"></p></section></section><section id="overview" class="grid hidden" aria-label="55 頁投影片總覽"></section><p class="help">鍵盤 ← → 翻頁 · N 切換講稿 · G 總覽 · F 全螢幕 · Esc 退出全螢幕 ｜ 可直接以 GitHub Pages 發布</p></main>
<script src="data.js"></script><script>
(()=>{'use strict';const data=window.LECTURE_DATA;if(!data||!Array.isArray(data.notes)){document.body.textContent='資料載入失敗：請確認 data.js 已上傳。';return;}const total=data.count,notes=data.notes;let current=0,showNotes=false,showOverview=false,fullscreen=false;const el=id=>document.getElementById(id);const filename=n=>'slides/slide-'+String(n+1).padStart(2,'0')+'.jpg';const img=el('slideImage');const noteBox=el('notesPane');const overview=el('overview');function render(){img.src=filename(current);img.alt='第 '+(current+1)+' 頁投影片';el('counter').textContent=(current+1)+' / '+total;el('prev').disabled=current===0;el('next').disabled=current===total-1;el('noteHeading').textContent='第 '+(current+1)+' 頁｜教師講稿';el('noteText').textContent=notes[current]||'本頁沒有另附講稿。';noteBox.classList.toggle('hidden',!showNotes);el('notesButton').textContent=showNotes?'隱藏講稿':'顯示講稿';el('notesButton').setAttribute('aria-expanded',String(showNotes));document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('selected',i===current));if(history.replaceState)history.replaceState(null,'','#slide-'+(current+1));}function go(i){current=Math.min(total-1,Math.max(0,i));render();}function toggleOverview(){showOverview=!showOverview;overview.classList.toggle('hidden',!showOverview);el('overviewButton').textContent=showOverview?'隱藏總覽':'頁面總覽';el('overviewButton').setAttribute('aria-expanded',String(showOverview));if(showOverview)overview.scrollIntoView({behavior:'smooth',block:'start'});}function full(){fullscreen=!fullscreen;document.body.classList.toggle('full',fullscreen);el('fullButton').textContent=fullscreen?'退出全螢幕':'全螢幕';}el('prev').onclick=()=>go(current-1);el('next').onclick=()=>go(current+1);el('notesButton').onclick=()=>{showNotes=!showNotes;render()};el('overviewButton').onclick=toggleOverview;el('fullButton').onclick=full;for(let i=0;i<total;i++){const b=document.createElement('button');b.className='thumb';b.type='button';const pic=document.createElement('img');pic.src=filename(i);pic.alt='第 '+(i+1)+' 頁縮圖';pic.loading='lazy';const label=document.createElement('span');label.textContent='第 '+(i+1)+' 頁';b.append(pic,label);b.onclick=()=>{go(i);if(showOverview)toggleOverview();window.scrollTo({top:0,behavior:'smooth'});};overview.append(b);}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){go(current-1);e.preventDefault()}if(e.key==='ArrowRight'){go(current+1);e.preventDefault()}if(e.key.toLowerCase()==='n'){showNotes=!showNotes;render()}if(e.key.toLowerCase()==='g')toggleOverview();if(e.key.toLowerCase()==='f')full();if(e.key==='Escape'&&fullscreen)full();});let h=Number((location.hash.match(/slide-(\d+)/)||[])[1]);if(h>=1&&h<=total)current=h-1;render();})();
</script></body></html>
